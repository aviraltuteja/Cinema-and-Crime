services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cinema_and_crime_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
      POSTGRES_DB: cinema_crime
    volumes:
      - cinema_and_crime_postgres_data:/var/lib/postgresql/data

volumes:
  cinema_and_crime_postgres_data:
